document.getElementById("f").addEventListener("submit", async e => {
  e.preventDefault();
  const btn = document.getElementById("b");
  btn.disabled = true;
  msg.className = "msg";
  // 600k PBKDF2 rounds is deliberately slow; say so or it reads as a hang.
  msg.textContent = "Deriving key…";
  try {
    const base = await crypto.subtle.importKey(
      "raw", new TextEncoder().encode(document.getElementById("p").value),
      "PBKDF2", false, ["deriveKey"]);
    const key = await crypto.subtle.deriveKey(
      {name:"PBKDF2", salt:b64(SALT), iterations:ITER, hash:"SHA-256"},
      base, {name:"AES-GCM", length:256}, false, ["decrypt"]);

    // returning plausible garbage.
    const plain = await crypto.subtle.decrypt(
      {name:"AES-GCM", iv:b64(IV)}, key, b64(CT));
    const html = await new Response(
      new Blob([plain]).stream().pipeThrough(new DecompressionStream("gzip"))
    ).text();
    document.open(); document.write(html); document.close();
  } catch (err) {
    msg.className = "msg err";
    msg.textContent = "Wrong passphrase.";
    btn.disabled = false;
  }
});
